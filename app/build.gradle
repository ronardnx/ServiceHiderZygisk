import com.v7878.zygisk.gradle.ZygoteLoader

plugins {
    id 'com.android.application'
    id 'com.github.aerath-stuff.ZygoteLoader'
}

android {
    namespace 'com.n0hindi.servicehider.zygisk'
    compileSdk 36

    defaultConfig {
        applicationId 'com.n0hindi.servicehider.zygisk'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

zygisk {
    packages('com.eltavine.duckdetector', 'com.chunqiunativecheck')
    id = 'servicehiderzygisk'
    name = 'ServiceHider Zygisk'
    author = 'ronard'
    description = 'Filters LineageOS ServiceManager calls without LSPosed or ART hooks'
    entrypoint = 'com.n0hindi.servicehider.zygisk.ZygoteEntry'
    archiveName = 'servicehider-zygisk'
    attachNativeLibs = false
    addVariantToArchiveName = false
}

dependencies {
}

tasks.configureEach { task ->
    if (task.name == 'zipMagiskRelease') {
        task.doFirst {
            def customizeDir = file("${buildDir}/intermediates/zygote_loader/customize_d/release")
            if (customizeDir.exists()) {
                new File(customizeDir, "40-auto-target-apps.sh").text = '''# Auto-target all installed third-party packages for Zygisk injection
ui_print "- Targeting all installed user applications"
mkdir -p "$MODPATH/packages"
if command -v pm >/dev/null 2>&1; then
    for pkg in $(pm list packages -3 2>/dev/null | cut -d: -f2); do
        if [ -n "$pkg" ]; then
            touch "$MODPATH/packages/$pkg"
        fi
    done
fi
'''
            }
        }
    }
}
